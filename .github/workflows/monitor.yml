
name: NRB External NTP Monitor

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nrb-external-ntp-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check NTP and notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check NTP and send notifications
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 check_ip.py

      - name: Save monitoring state
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update NTP monitoring state"
              git push origin HEAD:main
            fi
          fi
